            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

        }

            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script>
        // --- Router & History Logic ---
        function navigateTo(page, projectId = null) {
            // Instead of rendering directly, we update the URL Hash.
            // This adds the page to the browser's history stack.
            const hash = projectId ? `#project-detail/${projectId}` : `#${page}`;
            
            // If already on the page, force a re-render. Otherwise, change hash to trigger event.
            if (window.location.hash === hash) {
                renderPageFromHash();
            } else {
                window.location.hash = hash; 
            }
        }

        // Listens to URL Hash changes ( triggered by navigateTo OR pressing Back/Forward arrows )
        function renderPageFromHash() {
            let hash = window.location.hash.replace('#', '');
            if (!hash) hash = 'home';

            let page = hash;
            let projectId = null;

            // Check if it's a project detail page
            if (hash.startsWith('project-detail/')) {
                page = 'project-detail';
                projectId = hash.split('/')[1];
            }

            const content = document.getElementById('app-content');
            content.innerHTML = ''; // Clear current content
            window.scrollTo(0, 0);

            // Render matching section
            if (page === 'home') renderHome();
            else if (page === 'projects') renderProjects();
            else if (page === 'about') renderAbout();
            else if (page === 'contact') renderContact();
            else if (page === 'project-detail' && projectId) renderProjectDetail(projectId);
            else { page = 'home'; renderHome(); } // Fallback to home

            // Update Nav Active State
            const activeNavTarget = page === 'project-detail' ? 'projects' : page;
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('text-sky-400', link.innerText.toLowerCase() === activeNavTarget);
            });
            
            // Re-initialize icons
            lucide.createIcons();
        }

        // Tie the browser's Back/Forward button directly to the render function
        window.addEventListener('hashchange', renderPageFromHash);

        // --- Exit Confirmation (BeforeUnload) ---
        // Will prompt the user to confirm if they attempt to completely leave the domain/close the tab
        window.addEventListener('beforeunload', function (e) {
            // Cancel the event
            e.preventDefault(); 
            // Chrome requires returnValue to be set
            e.returnValue = ''; 
        });

        // --- Render Functions ---

        function renderHome() {

                        </div>
                        <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold mb-6 tracking-tight text-white leading-tight">

                        </h1>
                        <p class="text-base sm:text-lg md:text-xl text-slate-400 max-w-3xl mx-auto mb-10 leading-relaxed">
                            ${PORTFOLIO_DATA.profile.bio}

                        <div class="flex flex-col sm:flex-row justify-center gap-4">

                            <button onclick="navigateTo('contact')" class="px-8 py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-full border border-slate-700 transition-all w-full sm:w-auto text-base">Get In Touch</button>
                        </div>
                    </section>

                    <section class="py-16 md:py-20 px-4 md:px-8 max-w-7xl mx-auto">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 md:mb-12 gap-4">
                            <div>
                                <h2 class="text-2xl md:text-3xl font-bold text-white mb-2 leading-tight">Featured Projects</h2>
                                <p class="text-slate-400 text-sm md:text-base">Favorite things I've built recently.</p>
                            </div>
                            <button onclick="navigateTo('projects')" class="flex items-center text-sky-400 font-semibold hover:underline text-sm md:text-base">
                                View All Projects <i data-lucide="chevron-right" class="ml-1 w-4 h-4 md:w-5 md:h-5"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                            ${PORTFOLIO_DATA.projects.filter(p => p.featured).slice(0, 6).map(p => createProjectCard(p)).join('')}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderProjects() {
            const app = document.getElementById('app-content');
            app.innerHTML = `
                <section class="pt-20 md:pt-24 pb-20 px-4 md:px-8 max-w-7xl mx-auto fade-in">
                    <h2 class="text-3xl md:text-4xl font-bold text-white mb-4 text-center leading-tight">My Projects</h2>
                    <p class="text-slate-400 text-center mb-12 md:mb-16 max-w-xl mx-auto text-sm md:text-base">A complete list of my technical and creative experiments.</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                        ${PORTFOLIO_DATA.projects.map(p => createProjectCard(p)).join('')}
                    </div>
                </section>
            `;
        }

        function renderProjectDetail(id) {
            const project = PORTFOLIO_DATA.projects.find(p => p.id === id);
            if (!project) return navigateTo('projects'); // fallback

            const app = document.getElementById('app-content');
            
            // Build the links conditionally so empty ones don't render buttons
            let linksHTML = '';
            if (project.liveUrl) {
                linksHTML += `
                    <a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3.5 bg-sky-500 hover:bg-sky-400 text-white rounded-xl transition-colors">
                        <span class="text-sm md:text-base font-medium">Live Preview / Open App</span> <i data-lucide="external-link" class="w-4 h-4 md:w-5 md:h-5"></i>
                    </a>`;
            }
            if (project.githubUrl) {
                linksHTML += `
                    <a href="${project.githubUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-colors">
                        <span class="text-sm md:text-base font-medium">View Code</span> <i data-lucide="github" class="w-4 h-4 md:w-5 md:h-5"></i>
                    </a>`;
            }
            
            // If there are no links, we show a small message instead of an empty box
            const linksSection = linksHTML !== '' 
                ? `<div class="space-y-3">${linksHTML}</div>` 
                : `<p class="text-slate-400 text-sm italic">Links are currently unavailable for this project.</p>`;

            app.innerHTML = `
                <div class="pt-12 md:pt-16 pb-20 px-4 md:px-8 max-w-5xl mx-auto fade-in">
                    <button onclick="navigateTo('projects')" class="flex items-center text-slate-400 hover:text-white mb-6 md:mb-8 transition-colors text-sm md:text-base">
                        <i data-lucide="arrow-left" class="mr-2 w-4 h-4 md:w-5 md:h-5"></i> Back to projects
                    </button>
                    <div class="rounded-2xl md:rounded-3xl overflow-hidden mb-8 md:mb-10 shadow-2xl bg-slate-800">
                        <img src="${project.image}" alt="${project.title}" onerror="this.src='https://via.placeholder.com/800x400?text=No+Image+Available'" class="w-full h-auto max-h-[300px] md:max-h-[500px] object-cover" />
                    </div>
                    <div class="grid md:grid-cols-3 gap-8 md:gap-10">
                        <div class="md:col-span-2">
                            <h1 class="text-3xl md:text-4xl font-bold text-slate-100 mb-4 leading-tight">${project.title}</h1>
                            <div class="flex flex-wrap gap-2 mb-6">
                                ${project.tech.map(t => `<span class="px-3 py-1 bg-slate-800 rounded-full text-xs md:text-sm text-slate-300 border border-slate-700">${t}</span>`).join('')}
                            </div>
                            <p class="text-slate-300 leading-relaxed text-base md:text-lg whitespace-pre-line">${project.fullDesc}</p>
                        </div>
                        <div class="space-y-6">
                            <div class="bg-slate-800/50 p-5 md:p-6 rounded-2xl border border-slate-700">
                                <h4 class="text-slate-100 font-bold mb-4 text-base md:text-lg">Project Links</h4>
                                ${linksSection}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAbout() {

            app.innerHTML = `

                    <div class="grid md:grid-cols-3 gap-8 md:gap-12 items-start">
                        <div class="aspect-square rounded-2xl overflow-hidden border-2 border-slate-800 bg-slate-800 flex items-center justify-center max-w-xs mx-auto md:max-w-none w-full">
                            <img src="${PORTFOLIO_DATA.profile.image}" alt="Profile" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="w-full h-full object-cover">
                            <div class="hidden text-slate-500 text-center p-4">
                                <i data-lucide="user" size="64" class="mx-auto mb-2 opacity-50"></i>
                                <p class="text-sm">Image not found</p>
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <h2 class="text-3xl md:text-4xl font-bold text-white mb-6 text-center md:text-left leading-tight">About Me</h2>
                            <div class="space-y-4 text-slate-300 text-base md:text-lg leading-relaxed">
                                <p>I am a passionate creator based in ${PORTFOLIO_DATA.profile.location}. My journey started with a fascination for Microcontrollers and IoT.</p>
                                <p>I spend my time balancing between building web applications and implementing embedded solutions.</p>
                                <div class="pt-6">
                                    <h4 class="text-white font-bold mb-4 text-center md:text-left">Core Skills</h4>
                                    <div class="flex flex-wrap justify-center md:justify-start gap-2">
                                        ${PORTFOLIO_DATA.skills.map(s => `<span class="px-4 py-2 bg-slate-800 rounded-xl text-sky-400 text-xs md:text-sm font-medium border border-slate-700">${s}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderContact() {
            const app = document.getElementById('app-content');
            app.innerHTML = `
                <section class="pt-20 md:pt-24 pb-20 px-4 md:px-8 max-w-3xl mx-auto fade-in text-center">
                    <h2 class="text-3xl md:text-4xl font-bold text-white mb-4 leading-tight">Let's Talk</h2>
                    <p class="text-slate-400 mb-10 md:mb-12 text-sm md:text-base">Interested in collaborating or just want to say hi?</p>
                    <div class="bg-slate-800/50 p-6 md:p-8 rounded-2xl md:rounded-3xl border border-slate-700 shadow-xl text-left">
                        <div class="grid gap-5 md:gap-6">
                            <div>
                                <label class="block text-sm font-medium text-slate-400 mb-2">Full Name</label>
                                <input type="text" id="contact-name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 md:py-3.5 focus:outline-none focus:border-sky-500 text-white text-sm md:text-base transition-colors" placeholder="Your Name">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-400 mb-2">Email Address</label>
                                <input type="email" id="contact-email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 md:py-3.5 focus:outline-none focus:border-sky-500 text-white text-sm md:text-base transition-colors" placeholder="your@email.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-400 mb-2">Message</label>
                                <textarea id="contact-message" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 md:py-3.5 focus:outline-none focus:border-sky-500 text-white text-sm md:text-base transition-colors" placeholder="Tell me about your project..."></textarea>
                            </div>
                            <button onclick="handleSendMessage()" class="flex items-center justify-center gap-2 w-full py-3.5 md:py-4 bg-sky-500 hover:bg-sky-400 text-white font-bold rounded-xl transition-all text-base">
                                <i data-lucide="send" class="w-4 h-4 md:w-5 md:h-5"></i> Send Message
                            </button>
                            <p id="contact-status" class="text-center mt-1"></p>
                        </div>
                    </div>
                </section>
            `;
        }

        // --- Contact Form Logic ---
        function handleSendMessage() {
            const nameField = document.getElementById('contact-name');
            const emailField = document.getElementById('contact-email');
            const messageField = document.getElementById('contact-message');
            const statusText = document.getElementById('contact-status');

            const name = nameField.value.trim();
            const email = emailField.value.trim();
            const message = messageField.value.trim();

            // Simple validation
            if (!name || !email || !message) {
                statusText.innerText = "Please fill in all the fields.";
                statusText.className = "text-center mt-1 text-sm font-medium text-red-400";
                return;
            }

            // Create subject and body for the email
            const subject = `Portfolio Contact from ${name}`;
            const body = `Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`;
            
            // Build the mailto link
            const mailtoLink = `mailto:${PORTFOLIO_DATA.profile.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

            // Give the user some feedback and clear the form
            statusText.innerText = "Opening your email client...";
            statusText.className = "text-center mt-1 text-sm font-medium text-sky-400";
            
            // Open default mail client
            window.location.href = mailtoLink;

            // Optionally clear the form fields after a short delay
            setTimeout(() => {
                nameField.value = '';
                emailField.value = '';
                messageField.value = '';
                statusText.innerText = '';
            }, 3000);
        }

        // --- Helper: Create Project Card HTML ---
        function createProjectCard(project) {
            return `
                <div onclick="navigateTo('project-detail', '${project.id}')" class="group relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 hover:border-sky-500/50 transition-all duration-300 cursor-pointer hover:-translate-y-2 shadow-xl flex flex-col h-full">
                    <div class="h-40 md:h-48 overflow-hidden bg-slate-900 shrink-0">
                        <img src="${project.image}" alt="${project.title}" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                    </div>
                    <div class="p-5 md:p-6 flex flex-col flex-grow">
                        <span class="text-[10px] md:text-xs font-bold text-sky-400 uppercase tracking-widest">${project.category}</span>
                        <h3 class="text-lg md:text-xl font-bold mt-2 text-slate-100 leading-tight">${project.title}</h3>
                        <p class="text-slate-400 mt-2 text-sm md:text-base line-clamp-2 flex-grow leading-relaxed">${project.shortDesc}</p>
                        <div class="flex items-center mt-4 text-sky-400 text-xs md:text-sm font-semibold">
                            View Project <i data-lucide="chevron-right" class="ml-1 w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Initialization ---
        window.onload = () => {
            document.getElementById('footer-copy').innerText = `© ${new Date().getFullYear()} ${PORTFOLIO_DATA.profile.name}. All rights reserved.`;
            
            // Initial routing setup based on URL Hash
            if (!window.location.hash) {
                // If there's no hash, set it to home (this will trigger renderPageFromHash)
                window.location.hash = '#home';
            } else {
                // If someone linked directly to an exact page (like /#projects), render it
                renderPageFromHash();
            }
        };
    </script>
</body>
